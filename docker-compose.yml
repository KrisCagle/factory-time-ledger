# The app's own Postgres. bin/setup starts it. Port 5434 keeps it clear of
# Scarif's or any other local Postgres on 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5434:5432"
    volumes:
      - ledger_pg:/var/lib/postgresql/data
volumes:
  ledger_pg:
