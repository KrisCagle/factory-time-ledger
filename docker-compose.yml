# Optional: a Postgres for this app if you don't have one installed.
# Uses port 5434 so it won't clash with Scarif's or any other local Postgres.
# If you use this, set DB_USER=postgres, DB_PASSWORD=postgres and DB_PORT=5434 in .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - ledger_pg:/var/lib/postgresql/data
volumes:
  ledger_pg:
