name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Prepare database
        run: bin/rails db:create db:schema:load
      - name: Attribution engine (no database)
        run: ruby -Ilib test/lib/attribution_engine_test.rb
      - name: Full test suite
        run: |
          set -o pipefail
          bin/rails test 2>&1 | tee test-output.txt
      - name: Report results as annotations
        if: always()
        run: |
          # Annotations are readable through the GitHub API, so results can be
          # checked without downloading logs.
          summary=$(grep -E "[0-9]+ runs, [0-9]+ assertions" test-output.txt | tail -1)
          echo "::notice title=Test results::${summary:-no summary found}"
          grep -E "(Failure|Error):$" -A 6 test-output.txt | head -80 | tr '\n' ' ' | sed 's/--/\n/g' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Test failure::$line"
          done
          grep -iE "deprecat|warning:" test-output.txt | sort -u | head -10 | while IFS= read -r line; do
            echo "::warning title=Warning::$line"
          done
